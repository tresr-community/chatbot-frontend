---
inputs:
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling
  nixpkgs-unstable:
    url: github:nixos/nixpkgs/nixos-unstable
  fenix:
    url: github:nix-community/fenix
    inputs:
      nixpkgs:
        follows: nixpkgs
allowUnfree: true
clean:
  enabled: false
  keep:
    - EDITOR
    - USER
impure: true

# Not setting provider or profile here to allow user to configure it
# in the ~/.config/secretspec/config.toml
secretspec:
  enable: true
