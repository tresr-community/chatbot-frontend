#:schema node_modules/wrangler/config-schema.json
##################################################
# Name: wrangler.toml
# Description: Cloudflare Workers config
##################################################

##################################################
# Global
##################################################

name = "tresr-community-chatbot-frontend"

account_id = "6d6a8fb1f9f3f38b7374d4974c0743cf"

workers_dev = false

compatibility_date = "2024-12-01"

main = "./dist/_worker.js/index.js"
assets = { directory = "./dist", binding = "ASSETS" }

compatibility_flags = ["nodejs_compat_v2"]

logpush = false

[placement]

mode = "smart"

[observability]

enabled = true

#####################################################
# Development environment
#####################################################

[env.development]

local = true

# Ref: https://developers.cloudflare.com/workers/about/routes/
routes = [
	{ pattern = "localhost:9100/*", zone_name = "localhost" },
]

[env.development.build]

command = "bun run build"

[env.development.vars]

DEBUG = true

TITLE = "tresr community chatbot (Development)"
FOOTER_MESSAGE = "*** DEVELOPMENT ENVIRONMENT ***"
WELCOME_MESSAGE = "Hi, I'm Ron Jay."
AI_VERSION = "v1"
AI_BACKEND = "chatbot"
ALLOWED_ORIGINS = '{ "allowed_origins": ["https://localhost", "https://localhost:9000", "https://localhost:9100"] }'

[[env.development.r2_buckets]]

binding = "R2_ASSETS"
bucket_name = "tresr-community-chatbot-preview"
preview_bucket_name = "tresr-community-chatbot-preview"

#####################################################
# Preview environment
#####################################################

[env.preview]

# Ref: https://developers.cloudflare.com/workers/about/routes/
routes = [
	{ pattern = "preview.chat.tresr.community", custom_domain = true },
	{ pattern = "preview.chat.tresr.community/*", zone_name = "tresr.community" },
]

[env.preview.build]

command = "bun run build"

[env.preview.vars]

DEBUG = true

TITLE = "tresr community chatbot (Preview)"
FOOTER_MESSAGE = "*** PREVIEW ENVIRONMENT ***"
WELCOME_MESSAGE = "Hi, I'm Ron Jay."
AI_VERSION = "v1"
AI_BACKEND = "grok"
ALLOWED_ORIGINS = '{ "allowed_origins": ["https://preview.tresr.community","https://preview.chat.tresr.community"] }'

[[env.preview.r2_buckets]]

binding = "R2_ASSETS"
bucket_name = "tresr-community-chatbot-preview"
preview_bucket_name = "tresr-community-chatbot-preview"

#####################################################
# Production environment
#####################################################

[env.production]

# Ref: https://developers.cloudflare.com/workers/about/routes/
routes = [
	{ pattern = "chat.tresr.community", custom_domain = true },
	{ pattern = "chat.tresr.community/*", zone_name = "tresr.community" },
]

[env.production.build]

command = "bun run build"

[env.production.vars]

DEBUG = false

TITLE = "tresr community chatbot (Production)"
FOOTER_MESSAGE = "Ron Jay, serving the tresr community since 2024."
WELCOME_MESSAGE = "Hi, I'm Ron Jay."
AI_BACKEND = "grok"
AI_VERSION = "v1"
ALLOWED_ORIGINS = '{ "allowed_origins": ["https://tresr.community","https://chat.tresr.community"] }'

[[env.production.r2_buckets]]

binding = "R2_ASSETS"
bucket_name = "tresr-community-chatbot"
preview_bucket_name = "tresr-community-chatbot"
