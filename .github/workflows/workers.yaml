##################################################
# Name: workers.yaml
# Description:
#   A Workflow that publishes Cloudflare Workers.
##################################################

name: Workers

on:
  # Automatically run anytime there
  # is a push to the default branch
  push:
    branches:
      - trunk

  # Automatically run anytime a PR
  # targets the default branch
  # for the defined types.
  pull_request:
    branches:
      - trunk
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - review_requested

  # Re-build every week to ensure
  # the workers still builds as external
  # dependencies change.
  schedule:
    - cron: "0 0 * * 0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  checks: read
  statuses: read

defaults:
  run:
    shell: bash

env:
  # Cloudflare account details.
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_TOKEN_WRANGLER: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
  CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
  CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}

  # Enable or disable Cloudflare KV and R2
  CLOUDFLARE_KV_ENABLED: FALSE
  CLOUDFLARE_R2_ENABLED: TRUE

  # GitHUb details.
  ORGANISATION: ${{ github.repository_owner }}
  PROJECT: ${{ github.event.repository.name }}

  # Works on pushes or PRs
  BRANCH_NAME_CURRENT: ${{ github.head_ref || github.ref_name }}
  BRANCH_NAME_DEFAULT: ${{ github.event.repository.default_branch }}

jobs:
  ##################################################
  # Build and Deploy Cloudflare Worker (Frontend)
  ##################################################

  worker:
    name: Deploy Worker frontend

    runs-on: ubuntu-latest

    timeout-minutes: 60
    continue-on-error: false

    strategy:
      fail-fast: false

    steps:
      - id: checkout_repository
        name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0
          lfs: false
          persist-credentials: true
          submodules: recursive

      - id: install_nix
        name: "Install Nix ❄️"
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          enable_kvm: true

      - id: cachix
        name: "Enable Cachix ❄️"
        uses: cachix/cachix-action@v15
        if: vars.CACHIX_CACHE_NAME != ''
        with:
          name: ${{ vars.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          useDaemon: true
          skipPush: false

      - id: cache
        name: Magic Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - id: devenv_install
        name: Devenv install
        run: |
          nix profile install --accept-flake-config nixpkgs#devenv

      - id: get_environment
        name: Get Environment
        run: |
          if [[ "${{ env.BRANCH_NAME_CURRENT }}" == "${{ env.BRANCH_NAME_DEFAULT }}" ]];
          then
            echo "Environment: Production"
            echo "WRANGLER_ENVIRONMENT=production" >> "${GITHUB_OUTPUT}"
          else
            echo "Environment: Preview"
            echo "WRANGLER_ENVIRONMENT=preview" >> "${GITHUB_OUTPUT}"
          fi

      - id: publish_worker
        name: Publish worker using Wrangler
        shell: devenv shell --quiet bash -- -e {0}
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_TOKEN_WRANGLER }}
        run: |
          bun install
          bun run build
          wrangler deploy --minify --env ${{ steps.get_environment.outputs.WRANGLER_ENVIRONMENT }}
