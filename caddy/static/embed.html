<!doctype html>
<!--
  This is an example of how to embed the chatbot in a static HTML page.

  URL Parameters:
  - data-title: The title of the chatbot
  - data-style: The style of the chatbot (light or dark)
  - data-api-version: The version of the API to use
  - data-api-backend: The backend to use
  - data-debug: Whether to enable debug mode
-->
<html lang="en">
  <head>
    <title>chatbot Embed Test</title>
  </head>

  <body>
    <h1>Chatbot</h1>
    <p>This is a test page that embeds the chatbot</p>

    <footer>
      <p>This is an example footer</p>
    </footer>

    <script
      src="https://localhost:9000/loader.js"
      data-title="Chatbot"
      data-style="dark"
      data-api-version="v1"
      data-api-backend="chatbot"
      data-debug="true"
      defer
    ></script>
  </body>
</html>
